[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-queue"
version = "0.1.0"
description = "Emergency Unit Triage Queue Manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
triage-queue = "triage_queue.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
